5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="280" y="20" width="112" height="56" rx="10" fill="#e7f0fb" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="294" cy="34" r="10" fill="#1f3a5f"/><text x="294" y="34" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">3</text><text x="342" y="40.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Tempo &</text><text x="342" y="55.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Clock</text><polyline points="394,48 408,48" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="20" width="112" height="56" rx="10" fill="#e7f0fb" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="424" cy="34" r="10" fill="#1f3a5f"/><text x="424" y="34" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">4</text><text x="472" y="48.0" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Flip-Flops</text><polyline points="524,48 538,48" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="540" y="20" width="112" height="56" rx="10" fill="#e7f0fb" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="554" cy="34" r="10" fill="#1f3a5f"/><text x="554" y="34" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">5</text><text x="602" y="40.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Contadores</text><text x="602" y="55.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">assíncronos</text><polyline points="596,78 596,112" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="540" y="114" width="112" height="56" rx="10" fill="#fdf0e6" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="554" cy="128" r="10" fill="#1f3a5f"/><text x="554" y="128" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">6</text><text x="602" y="134.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Contadores</text><text x="602" y="149.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">síncronos</text><polyline points="538,142 524,142" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="410" y="114" width="112" height="56" rx="10" fill="#fdf0e6" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="424" cy="128" r="10" fill="#1f3a5f"/><text x="424" y="128" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">7</text><text x="472" y="142.0" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Registradores</text><polyline points="408,142 394,142" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="280" y="114" width="112" height="56" rx="10" fill="#fdf0e6" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="294" cy="128" r="10" fill="#1f3a5f"/><text x="294" y="128" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">8</text><text x="342" y="142.0" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Memórias</text><polyline points="278,142 264,142" fill="none" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="150" y="114" width="112" height="56" rx="10" fill="#e9f7ec" stroke="#1f3a5f" stroke-width="1.5"/><circle cx="164" cy="128" r="10" fill="#1f3a5f"/><text x="164" y="128" font-size="11" text-anchor="middle" fill="white" font-weight="700" dominant-baseline="middle">9</text><text x="212" y="134.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Máquinas de</text><text x="212" y="149.5" font-size="12.5" text-anchor="middle" fill="#1d2939" font-weight="600" dominant-baseline="middle">Estados</text><text x="20" y="196" font-size="11" text-anchor="start" fill="#98a2b3" font-weight="normal" dominant-baseline="middle">Cada capítulo usa o anterior: o latch é feito de portas, o flip-flop é um latch com clock, contadores e registradores são grupos de flip-flops,</text><text x="20" y="212" font-size="11" text-anchor="start" fill="#98a2b3" font-weight="normal" dominant-baseline="middle">memórias são grandes conjuntos de registradores, e a máquina de estados é a ideia geral por trás de tudo.</text></svg>