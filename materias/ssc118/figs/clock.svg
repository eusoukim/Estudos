<svg viewBox="0 0 660 146" width="660" height="146" xmlns="http://www.w3.org/2000/svg" font-family="Inter, DejaVu Sans, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2939"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c64b4"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#c92a2a" stroke-width="2" opacity="0.45"/></pattern></defs><polyline points="40,100 60,100 60,40 110,40 110,100 160,100 160,100 160,40 210,40 210,100 260,100 260,100 260,40 310,40 310,100 360,100 360,100 360,40 410,40 410,100 460,100" fill="none" stroke="#1c64b4" stroke-width="2.4" stroke-linejoin="round"/><text x="20" y="40" font-size="12" text-anchor="middle" fill="#98a2b3" font-weight="normal" dominant-baseline="middle">1</text><text x="20" y="100" font-size="12" text-anchor="middle" fill="#98a2b3" font-weight="normal" dominant-baseline="middle">0</text><polyline points="160,120 260,120" fill="none" stroke="#d9480f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrO)"/><polyline points="260,120 160,120" fill="none" stroke="#d9480f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrO)"/><polyline points="160,104 160,128" fill="none" stroke="#d9480f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3,3"/><polyline points="260,104 260,128" fill="none" stroke="#d9480f" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3,3"/><text x="210" y="136" font-size="12" text-anchor="middle" fill="#d9480f" font-weight="700" dominant-baseline="middle">período T</text><polyline points="160,26 210,26" fill="none" stroke="#2b8a3e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="210,26 160,26" fill="none" stroke="#2b8a3e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr)"/><text x="185" y="14" font-size="11" text-anchor="middle" fill="#2b8a3e" font-weight="700" dominant-baseline="middle">t(alto)</text><text x="470" y="50" font-size="15" text-anchor="start" fill="#1d2939" font-weight="700" dominant-baseline="middle">f = 1 / T</text><text x="470" y="76" font-size="13" text-anchor="start" fill="#1d2939" font-weight="600" dominant-baseline="middle">duty cycle = t(alto) / T</text><text x="470" y="98" font-size="12" text-anchor="start" fill="#98a2b3" font-weight="normal" dominant-baseline="middle">aqui: 50 / 100 = 50 %</text></svg>