<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 780 254" width="780" height="254" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, IBM Plex Mono, DejaVu Sans Mono, monospace"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#121212"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e23b3b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bff"/></marker></defs><rect x="24" y="24" width="210" height="190" rx="8" fill="#121212"/><rect x="20" y="20" width="210" height="190" rx="8" fill="#ffd23f" stroke="#121212" stroke-width="2.5"/><text x="125" y="44" font-size="15" text-anchor="middle" fill="#121212" font-weight="700" dominant-baseline="middle" font-family="Space Grotesk, IBM Plex Sans, DejaVu Sans, sans-serif">Programa do usuário</text><text x="125" y="66" font-size="12" text-anchor="middle" fill="#121212" font-weight="600" dominant-baseline="middle">main.c</text><line x1="32" y1="80" x2="218" y2="80" stroke="#121212" stroke-width="1.5" stroke-dasharray="4 3"/><text x="34" y="100" font-size="11.5" text-anchor="start" fill="#121212" font-weight="600" dominant-baseline="middle">usa só as operações:</text><text x="34" y="119" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">pilha_empilhar(p, 7);</text><text x="34" y="138" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">x = pilha_desempilhar(p);</text><polyline points="234,115 266,115" fill="none" stroke="#121212" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/><rect x="274" y="24" width="210" height="190" rx="8" fill="#121212"/><rect x="270" y="20" width="210" height="190" rx="8" fill="#3ddc97" stroke="#121212" stroke-width="2.5"/><text x="375" y="44" font-size="15" text-anchor="middle" fill="#121212" font-weight="700" dominant-baseline="middle" font-family="Space Grotesk, IBM Plex Sans, DejaVu Sans, sans-serif">Interface</text><text x="375" y="66" font-size="12" text-anchor="middle" fill="#121212" font-weight="600" dominant-baseline="middle">pilha.h</text><line x1="282" y1="80" x2="468" y2="80" stroke="#121212" stroke-width="1.5" stroke-dasharray="4 3"/><text x="284" y="100" font-size="11.5" text-anchor="start" fill="#121212" font-weight="600" dominant-baseline="middle">o QUE existe:</text><text x="284" y="119" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">typedef struct pilha PILHA;</text><text x="284" y="138" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">PILHA *pilha_criar(void);</text><text x="284" y="157" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">bool pilha_empilhar(...);</text><polyline points="484,115 516,115" fill="none" stroke="#121212" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#a)"/><rect x="524" y="24" width="210" height="190" rx="8" fill="#121212"/><rect x="520" y="20" width="210" height="190" rx="8" fill="#efe7d6" stroke="#121212" stroke-width="2.5"/><text x="625" y="44" font-size="15" text-anchor="middle" fill="#121212" font-weight="700" dominant-baseline="middle" font-family="Space Grotesk, IBM Plex Sans, DejaVu Sans, sans-serif">Implementação</text><text x="625" y="66" font-size="12" text-anchor="middle" fill="#121212" font-weight="600" dominant-baseline="middle">pilha.c</text><line x1="532" y1="80" x2="718" y2="80" stroke="#121212" stroke-width="1.5" stroke-dasharray="4 3"/><text x="534" y="100" font-size="11.5" text-anchor="start" fill="#121212" font-weight="600" dominant-baseline="middle">o COMO é feito:</text><text x="534" y="119" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">struct pilha {</text><text x="534" y="138" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">  int itens[MAX];</text><text x="534" y="157" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">  int topo;</text><text x="534" y="176" font-size="11.5" text-anchor="start" fill="#121212" font-weight="500" dominant-baseline="middle">};</text><text x="380" y="238" font-size="12.5" text-anchor="middle" fill="#121212" font-weight="600" dominant-baseline="middle" font-family="Space Grotesk, IBM Plex Sans, DejaVu Sans, sans-serif">O usuário só enxerga a interface. A implementação pode mudar sem quebrar o programa dele.</text></svg>